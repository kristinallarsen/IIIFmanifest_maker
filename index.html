<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internet Archive IIIF Manifest Generator</title>
    <style>
        /* Import Open Sans from Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap');
        
        /* Basic Reset & Font */
        body {
            font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Main container card */
        .container {
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #1a1a1a;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

       .iiif-logo {
          height: 40px;
          width: auto;
          margin-right: 15px;
            margin-bottom: 0px;
        }        
        
        /* Input and Button Group */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: bold;
            text-align: left;
            margin-bottom: -5px;
        }
        
        #ia-identifier {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        #ia-identifier:focus {
            border-color: #0073A3;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);
            outline: none;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: #0073A3;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #004f70;
        }

        /* Result Area */
        #result-container {
            margin-top: 30px;
            padding: 20px;
            background-color: #e9ecef;
            border-radius: 8px;
            text-align: left;
            position: relative;
        }
        
        /* Utility class to hide element */
        .hidden {
            display: none;
        }

        h2 {
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 10px;
        }

        pre {
            background-color: #343a40;
            color: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            white-space: pre-wrap;      /* ensures long URLs wrap */
            word-break: break-all;      /* breaks the word to prevent overflow */
        }
        
        #copy-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: #6c757d;
            padding: 5px 10px;
            font-size: 12px;
        }
        
        #copy-btn:hover {
            background-color: #5a6268;
        }
        
        #copy-feedback {
            position: absolute;
            top: 20px;
            right: 85px; /* next to copy button */
            font-size: 12px;
            color: #28a745;
            font-weight: bold;
        }

    </style>
</head>
<body>

    <div class="container">      
        <h1><img src="https://upload.wikimedia.org/wikipedia/commons/e/e8/International_Image_Interoperability_Framework_logo.png" alt="IIIF Logo" class="iiif-logo">IIIF Manifest Generator</h1>
          <p>Paste an Internet Archive link (or just an identifier) to generate its IIIF manifest URL.</p>

    <div class="input-group">
        <label for="ia-identifier">Internet Archive Link or Identifier:</label>
        <input type="text" id="ia-identifier" placeholder="e.g., https://archive.org/details/msirvinproofsofp00irvi">
        <button id="generate-btn">Generate URL</button>
    </div>

        <div id="result-container" class="hidden">
            <h2>Generated Manifest URL:</h2>
            <pre><code id="manifest-url"></code></pre>
            <button id="copy-btn">Copy</button>
            <span id="copy-feedback"></span>
        </div>
    </div>

   <script>
    document.addEventListener('DOMContentLoaded', () => {
        const identifierInput = document.getElementById('ia-identifier');
        const generateBtn = document.getElementById('generate-btn');
        const resultContainer = document.getElementById('result-container');
        const manifestUrlElement = document.getElementById('manifest-url');
        const copyBtn = document.getElementById('copy-btn');
        const copyFeedback = document.getElementById('copy-feedback');

        // Path prefixes on archive.org where the identifier is the next segment
        const IA_PATH_PREFIXES = ['details', 'stream', 'download', 'embed', 'compress', 'metadata', 'services'];

        /**
         * Accepts either a full Internet Archive URL or a bare identifier
         * and returns the identifier (or null if one can't be found).
         */
        const extractIdentifier = (input) => {
            const value = input.trim();
            if (!value) return null;

            // Looks like a URL or contains a path? Try to parse it.
            if (/^https?:\/\//i.test(value) || value.includes('/') || value.includes('archive.org')) {
                let url;
                try {
                    url = new URL(/^https?:\/\//i.test(value) ? value : 'https://' + value);
                } catch (e) {
                    return null;
                }

                const host = url.hostname.toLowerCase();
                const isIA = host === 'archive.org' || host.endsWith('.archive.org');
                if (!isIA) return null;

                const segments = url.pathname.split('/').filter(Boolean);

                // https://archive.org/details/ID/..., /stream/ID/..., /download/ID/..., etc.
                if (IA_PATH_PREFIXES.includes(segments[0]) && segments[1]) {
                    return decodeURIComponent(segments[1]);
                }

                // https://iiif.archive.org/iiif/ID/manifest.json
                if (segments[0] === 'iiif' && segments[1]) {
                    return decodeURIComponent(segments[1]);
                }

                return null;
            }

            // Otherwise, treat it as a bare identifier
            return /^[A-Za-z0-9._-]+$/.test(value) ? value : null;
        };

        const generateManifestUrl = () => {
            const rawInput = identifierInput.value;
            const identifier = extractIdentifier(rawInput);

            if (identifier) {
                const manifestUrl = `https://iiif.archive.org/iiif/${identifier}/manifest.json`;
                manifestUrlElement.textContent = manifestUrl;
                resultContainer.classList.remove('hidden');
                copyFeedback.textContent = '';
            } else {
                resultContainer.classList.add('hidden');
                alert(rawInput.trim()
                    ? 'Could not find an Internet Archive identifier in that input. Please paste a link like https://archive.org/details/your-identifier.'
                    : 'Please enter an Internet Archive link or identifier.');
            }
        };

        generateBtn.addEventListener('click', generateManifestUrl);

        identifierInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                event.preventDefault();
                generateBtn.click();
            }
        });

        copyBtn.addEventListener('click', () => {
            const urlToCopy = manifestUrlElement.textContent;
            navigator.clipboard.writeText(urlToCopy).then(() => {
                copyFeedback.textContent = 'Copied!';
                setTimeout(() => { copyFeedback.textContent = ''; }, 2000);
            }).catch(err => {
                copyFeedback.textContent = 'Failed!';
                console.error('Failed to copy: ', err);
            });
        });
    });
</script>

</body>
</html>
